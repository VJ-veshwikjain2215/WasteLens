services:
  postgres:
    image: postgres:16-alpine
    container_name: wastelens-postgres
    environment:
      POSTGRES_DB: wastelens
      POSTGRES_USER: wastelens_app
      POSTGRES_PASSWORD: wastelens_secret
    ports:
      - "5432:5432"
    volumes:
      - wastelens_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wastelens_app -d wastelens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wastelens_db_data:
