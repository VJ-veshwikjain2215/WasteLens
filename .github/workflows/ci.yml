name: WasteLens CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend (Typecheck, Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: code/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend static assets
        run: npm run build

  backend-unit:
    name: Backend Unit & Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run unit & security tests
        run: mvn test -B

  backend-integration:
    name: Backend PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-unit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wastelens
          POSTGRES_USER: wastelens_app
          POSTGRES_PASSWORD: wastelens_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: code/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run schema migration
        run: PGPASSWORD=wastelens_secret psql -h localhost -U wastelens_app -d wastelens -f src/main/resources/db/migration/V1__init_schema.sql

      - name: Run integration tests against PostgreSQL
        env:
          DB_JDBC_URL: jdbc:postgresql://localhost:5432/wastelens
          DB_USER: wastelens_app
          DB_PASSWORD: wastelens_secret
        run: mvn test -B
